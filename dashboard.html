<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Papan Antrian Posting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E8E6DC;
    --paper-alt:#DEDBCE;
    --ink:#20241F;
    --ink-soft:#5B6058;
    --ink-faint:#8B8F86;
    --line:#C6C2B2;
    --stamp-grey:#7C8077;
    --stamp-ochre:#AD7A26;
    --stamp-green:#3E6E52;
    --stamp-red:#A23A2C;
    --white:#FBFAF6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      repeating-linear-gradient(
        to bottom,
        transparent 0px, transparent 27px,
        rgba(32,36,31,0.05) 27px, rgba(32,36,31,0.05) 28px
      ),
      var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14px;
    line-height:1.5;
  }
  .mono{ font-family:'IBM Plex Mono', monospace; }

  .wrap{ max-width:920px; margin:0 auto; padding:28px 24px 80px; }

  header.top{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px; margin-bottom:6px;
    flex-wrap:wrap; gap:8px;
  }
  header.top h1{
    font-size:22px; font-weight:600; margin:0; letter-spacing:0.2px;
  }
  header.top .meta{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px; color:var(--ink-soft);
  }

  .privacy-note{
    font-size:12px; color:var(--ink-soft); margin:10px 0 22px;
  }

  nav.tabs{
    display:flex; gap:2px; margin-bottom:20px;
  }
  nav.tabs button{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    background:transparent; border:1px solid var(--line);
    border-bottom:none;
    padding:9px 16px;
    cursor:pointer;
    color:var(--ink-soft);
    position:relative; top:1px;
  }
  nav.tabs button.active{
    background:var(--white);
    color:var(--ink);
    border-color:var(--ink);
    font-weight:600;
  }
  .panel{
    border:1px solid var(--ink);
    background:var(--white);
    padding:22px;
    min-height:300px;
  }
  .panel h2{
    font-size:15px; margin:0 0 4px; font-weight:600;
  }
  .panel .sub{
    color:var(--ink-soft); font-size:12.5px; margin:0 0 18px;
  }

  /* ---- stat strip ---- */
  .stats{
    display:flex; gap:0; margin:18px 0 22px;
    border:1px solid var(--line);
  }
  .stat{
    flex:1; padding:12px 14px; border-right:1px solid var(--line);
  }
  .stat:last-child{ border-right:none; }
  .stat .n{ font-family:'IBM Plex Mono', monospace; font-size:20px; font-weight:600; }
  .stat .l{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }

  /* ---- forms ---- */
  .field{ margin-bottom:14px; }
  .field label{
    display:block; font-size:12px; color:var(--ink-soft); margin-bottom:5px;
  }
  .field input[type=text], .field input[type=password], .field input[type=number], .field textarea{
    width:100%; padding:9px 10px; border:1px solid var(--line);
    background:var(--paper-alt);
    font-family:'IBM Plex Mono', monospace; font-size:13px; color:var(--ink);
  }
  .field textarea{ font-family:'IBM Plex Sans', sans-serif; resize:vertical; min-height:60px; }
  .field input:focus, .field textarea:focus{ outline:2px solid var(--ink); outline-offset:1px; }
  .field .hint{ font-size:11px; color:var(--ink-faint); margin-top:4px; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:0 18px; }
  .checkline{ display:flex; align-items:center; gap:8px; margin:6px 0 18px; }
  .checkline label{ font-size:12.5px; color:var(--ink-soft); }

  fieldset{ border:1px solid var(--line); margin:0 0 20px; padding:14px 16px 4px; }
  legend{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--ink-soft); padding:0 6px; }

  button.primary{
    font-family:'IBM Plex Mono', monospace; font-size:13px; font-weight:600;
    background:var(--ink); color:var(--white); border:1px solid var(--ink);
    padding:10px 18px; cursor:pointer;
  }
  button.primary:hover{ background:#111510; }
  button.primary:disabled{ opacity:0.45; cursor:not-allowed; }
  button.ghost{
    font-family:'IBM Plex Mono', monospace; font-size:12px;
    background:transparent; color:var(--ink-soft); border:1px solid var(--line);
    padding:8px 14px; cursor:pointer;
  }
  button.ghost:hover{ border-color:var(--ink); color:var(--ink); }
  button.small{ padding:5px 9px; font-size:11px; }

  .save-row{ display:flex; align-items:center; gap:12px; margin-top:6px; }
  .save-msg{ font-size:12px; color:var(--stamp-green); }

  /* ---- queue ---- */
  .queue-actions{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px; }
  .filepicker{
    border:1px dashed var(--line); padding:22px; text-align:center;
    color:var(--ink-soft); font-size:12.5px; cursor:pointer;
    margin-bottom:18px;
  }
  .filepicker:hover{ border-color:var(--ink); color:var(--ink); }
  .filepicker input{ display:none; }

  table.queue{ width:100%; border-collapse:collapse; }
  table.queue th{
    text-align:left; font-family:'IBM Plex Mono', monospace; font-size:11px;
    color:var(--ink-soft); font-weight:500; padding:6px 8px;
    border-bottom:1px solid var(--ink);
  }
  table.queue td{
    padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:top;
  }
  table.queue tr:last-child td{ border-bottom:1px solid var(--ink); }
  .qnum{ font-family:'IBM Plex Mono', monospace; color:var(--ink-faint); width:30px; }
  .thumb{
    width:46px; height:46px; object-fit:cover; border:1px solid var(--line); background:var(--paper-alt);
    display:flex; align-items:center; justify-content:center; font-size:16px; color:var(--ink-faint);
  }
  .fname{ font-size:12.5px; font-weight:500; word-break:break-all; }
  .fsize{ font-size:11px; color:var(--ink-faint); }
  .qcaption{
    width:100%; min-height:44px; font-family:'IBM Plex Sans', sans-serif; font-size:12.5px;
    border:1px solid var(--line); background:var(--paper-alt); padding:6px 8px; resize:vertical;
  }
  .qsched{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--ink-soft); }

  .stamp{
    font-family:'IBM Plex Mono', monospace; font-size:10.5px; font-weight:600;
    letter-spacing:0.5px; text-transform:uppercase;
    padding:3px 7px; border:1.5px solid; display:inline-block;
    transform:rotate(-2deg);
    white-space:nowrap;
  }
  .stamp.pending{ color:var(--stamp-grey); border-color:var(--stamp-grey); }
  .stamp.scheduled{ color:var(--stamp-ochre); border-color:var(--stamp-ochre); }
  .stamp.posted{ color:var(--stamp-green); border-color:var(--stamp-green); }
  .stamp.failed{ color:var(--stamp-red); border-color:var(--stamp-red); }
  .stamp.uploading{ color:var(--ink); border-color:var(--ink); }

  .row-actions{ display:flex; gap:6px; }
  .empty{
    text-align:center; padding:50px 20px; color:var(--ink-faint); font-size:13px;
  }

  .err-detail{ font-size:11px; color:var(--stamp-red); margin-top:4px; max-width:220px; }

  /* ---- history ---- */
  .hist-row{
    display:flex; gap:14px; align-items:flex-start;
    padding:12px 0; border-bottom:1px solid var(--line);
  }
  .hist-row:last-child{ border-bottom:none; }
  .hist-time{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-faint); width:130px; flex-shrink:0; }
  .hist-body{ flex:1; }
  .hist-name{ font-size:12.5px; font-weight:500; }
  .hist-cap{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }

  .banner{
    border:1px solid var(--stamp-ochre); background:#F4EDDD; color:#5C4416;
    font-size:12px; padding:10px 14px; margin-bottom:18px;
  }
  .banner strong{ font-weight:600; }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1>Papan Antrian Posting</h1>
    <div class="meta" id="pageMeta">Facebook + link Shopee</div>
  </header>
  <div class="privacy-note">Kredensial &amp; riwayat disimpan hanya untuk akunmu di sini, tidak terlihat orang lain.</div>

  <div class="stats" id="statStrip"></div>

  <nav class="tabs" id="tabs">
    <button data-tab="queue" class="active">Antrian</button>
    <button data-tab="history">Riwayat</button>
    <button data-tab="settings">Pengaturan</button>
  </nav>

  <div class="panel" id="panel"></div>

</div>

<script>
(function(){

  // ---------------------------------------------------------- storage helpers
  const hasStorage = typeof window.storage !== 'undefined';

  async function storageGet(key){
    if(!hasStorage) return null;
    try{
      const r = await window.storage.get(key, false);
      return r ? r.value : null;
    }catch(e){ return null; }
  }
  async function storageSet(key, value){
    if(!hasStorage) return false;
    try{
      const r = await window.storage.set(key, value, false);
      return !!r;
    }catch(e){ return false; }
  }

  const CONFIG_KEY = 'fb_shopee_config';
  const HISTORY_KEY = 'fb_shopee_history';

  const defaultConfig = {
    appId:'', userToken:'', pageId:'', pageToken:'',
    shopeeLink:'', caption:'Cek produk ini sekarang, stok terbatas!',
    autoSchedule:true, startHour:10, intervalHours:24
  };

  let config = {...defaultConfig};
  let history = [];   // [{id, filename, type, status, caption, time, detail}]
  let queue = [];      // [{id, file, kind, caption, status, detail}]
  let activeTab = 'queue';
  let posting = false;

  // ---------------------------------------------------------- init
  async function init(){
    const rawConf = await storageGet(CONFIG_KEY);
    if(rawConf){ try{ config = {...defaultConfig, ...JSON.parse(rawConf)}; }catch(e){} }

    const rawHist = await storageGet(HISTORY_KEY);
    if(rawHist){ try{ history = JSON.parse(rawHist); }catch(e){} }

    render();
  }

  // ---------------------------------------------------------- utils
  function uid(){ return Math.random().toString(36).slice(2,10); }
  function fmtBytes(n){
    if(n < 1024) return n + ' B';
    if(n < 1024*1024) return (n/1024).toFixed(0) + ' KB';
    return (n/1024/1024).toFixed(1) + ' MB';
  }
  function fmtTime(ts){
    const d = new Date(ts);
    return d.toLocaleDateString('id-ID', {day:'2-digit', month:'short'}) + ' ' +
           d.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
  }
  function buildCaption(override){
    const base = (override && override.trim()) ? override.trim() : config.caption;
    const link = config.shopeeLink ? `\n\n🛒 ${config.shopeeLink}` : '';
    return base + link;
  }
  function scheduleTimestamp(slotIndex){
    if(!config.autoSchedule) return null;
    const base = new Date();
    base.setDate(base.getDate()+1);
    base.setHours(Number(config.startHour)||10, 0, 0, 0);
    base.setHours(base.getHours() + (Number(config.intervalHours)||24) * slotIndex);
    return Math.floor(base.getTime()/1000);
  }
  function isConfigReady(){
    return config.appId && config.userToken && config.pageId && config.pageToken && config.shopeeLink;
  }

  // ---------------------------------------------------------- Graph API calls
  const GRAPH_VERSION = 'v25.0';
  const GRAPH_BASE = `https://graph.facebook.com/${GRAPH_VERSION}`;
  const GRAPH_VIDEO_BASE = `https://graph-video.facebook.com/${GRAPH_VERSION}`;
  const CHUNK_SIZE = 4*1024*1024;

  async function postPhoto(item, publishTs){
    const form = new FormData();
    form.append('access_token', config.pageToken);
    form.append('caption', buildCaption(item.caption));
    if(publishTs){
      form.append('published', 'false');
      form.append('scheduled_publish_time', String(publishTs));
    }
    form.append('source', item.file, item.file.name);

    const resp = await fetch(`${GRAPH_BASE}/${config.pageId}/photos`, { method:'POST', body: form });
    const json = await resp.json().catch(()=>({}));
    if(!resp.ok){ throw new Error(json?.error?.message || `HTTP ${resp.status}`); }
    return json;
  }

  async function startUploadSession(file){
    const url = `${GRAPH_BASE}/${config.appId}/uploads?` + new URLSearchParams({
      file_name:file.name, file_length:String(file.size), file_type:'video/mp4',
      access_token:config.userToken
    });
    const resp = await fetch(url, { method:'POST' });
    const json = await resp.json().catch(()=>({}));
    if(!resp.ok){ throw new Error(json?.error?.message || `HTTP ${resp.status}`); }
    return json.id; // "upload:<SESSION_ID>"
  }

  async function uploadVideoBytes(sessionId, file, onProgress){
    let offset = 0;
    let handle = null;
    while(offset < file.size){
      const chunk = file.slice(offset, offset + CHUNK_SIZE);
      const resp = await fetch(`${GRAPH_BASE}/${sessionId}`, {
        method:'POST',
        headers:{
          'Authorization': `OAuth ${config.userToken}`,
          'file_offset': String(offset)
        },
        body: chunk
      });
      const json = await resp.json().catch(()=>({}));
      if(!resp.ok){ throw new Error(json?.error?.message || `HTTP ${resp.status}`); }
      if(json.h){ handle = json.h; break; }
      offset += chunk.size;
      if(onProgress) onProgress(Math.min(100, Math.round(offset/file.size*100)));
    }
    return handle;
  }

  async function postVideo(item, publishTs, onProgress){
    const sessionId = await startUploadSession(item.file);
    const handle = await uploadVideoBytes(sessionId, item.file, onProgress);
    if(!handle) throw new Error('Upload video tidak menghasilkan file handle.');

    const form = new URLSearchParams();
    form.append('access_token', config.pageToken);
    form.append('description', buildCaption(item.caption));
    form.append('fbuploader_video_file_chunk', handle);
    if(publishTs){
      form.append('published', 'false');
      form.append('scheduled_publish_time', String(publishTs));
    }
    const resp = await fetch(`${GRAPH_VIDEO_BASE}/${config.pageId}/videos`, {
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body: form.toString()
    });
    const json = await resp.json().catch(()=>({}));
    if(!resp.ok){ throw new Error(json?.error?.message || `HTTP ${resp.status}`); }
    return json;
  }

  // ---------------------------------------------------------- posting flow
  async function postItem(item, slotIndex){
    item.status = 'uploading';
    render();
    const publishTs = scheduleTimestamp(slotIndex);
    try{
      let result;
      if(item.kind === 'video'){
        result = await postVideo(item, publishTs, (pct)=>{ item.progress = pct; render(); });
      }else{
        result = await postPhoto(item, publishTs);
      }
      item.status = publishTs ? 'scheduled' : 'posted';
      item.detail = result && result.id ? `id: ${result.id}` : '';
      pushHistory(item, item.status, item.detail);
      return true;
    }catch(err){
      item.status = 'failed';
      item.detail = String(err.message || err);
      pushHistory(item, 'failed', item.detail);
      return false;
    }finally{
      render();
    }
  }

  function pushHistory(item, status, detail){
    history.unshift({
      id: uid(), filename: item.file.name, type: item.kind, status,
      caption: buildCaption(item.caption), time: Date.now(), detail: detail || ''
    });
    storageSet(HISTORY_KEY, JSON.stringify(history.slice(0, 300)));
  }

  async function postAll(){
    if(posting) return;
    if(!isConfigReady()){ alert('Lengkapi Pengaturan dulu (token, ID, link Shopee).'); switchTab('settings'); return; }
    posting = true;
    let slot = 0;
    for(const item of queue){
      if(item.status === 'posted' || item.status === 'scheduled') continue;
      const ok = await postItem(item, slot);
      if(ok) slot++;
    }
    posting = false;
    render();
  }

  async function postSingle(itemId){
    if(!isConfigReady()){ alert('Lengkapi Pengaturan dulu (token, ID, link Shopee).'); switchTab('settings'); return; }
    const item = queue.find(q=>q.id===itemId);
    if(!item) return;
    posting = true; render();
    await postItem(item, 0);
    posting = false; render();
  }

  // ---------------------------------------------------------- file handling
  function addFiles(fileList){
    Array.from(fileList).forEach(file=>{
      const isImg = /^image\/(jpeg|png)$/.test(file.type) || /\.(jpe?g|png)$/i.test(file.name);
      const isVid = /^video\/(mp4|quicktime)$/.test(file.type) || /\.(mp4|mov)$/i.test(file.name);
      if(!isImg && !isVid) return;
      queue.push({
        id:uid(), file, kind:isImg?'photo':'video',
        caption:'', status:'pending', detail:'', progress:0,
        previewUrl: isImg ? URL.createObjectURL(file) : null
      });
    });
    render();
  }

  function removeItem(id){
    queue = queue.filter(q=>q.id!==id);
    render();
  }

  // ---------------------------------------------------------- render
  function switchTab(tab){ activeTab = tab; render(); }

  function statStripHtml(){
    const posted = history.filter(h=>h.status==='posted'||h.status==='scheduled').length;
    const failed = history.filter(h=>h.status==='failed').length;
    return `
      <div class="stat"><div class="n mono">${queue.length}</div><div class="l">di antrian</div></div>
      <div class="stat"><div class="n mono">${posted}</div><div class="l">terkirim / terjadwal</div></div>
      <div class="stat"><div class="n mono">${failed}</div><div class="l">gagal</div></div>
    `;
  }

  function stampHtml(status){
    const map = {
      pending:'Draft', uploading:'Mengirim…', scheduled:'Terjadwal', posted:'Terkirim', failed:'Gagal'
    };
    return `<span class="stamp ${status}">${map[status]||status}</span>`;
  }

  function queuePanelHtml(){
    const readyBanner = !isConfigReady() ? `
      <div class="banner"><strong>Pengaturan belum lengkap.</strong> Isi token &amp; link Shopee di tab Pengaturan sebelum posting.</div>
    ` : '';

    const rows = queue.map((item, idx)=>{
      const thumb = item.previewUrl
        ? `<img class="thumb" src="${item.previewUrl}" />`
        : `<div class="thumb">▶</div>`;
      const schedTs = config.autoSchedule ? scheduleTimestamp(idx) : null;
      const schedLabel = item.status==='posted' || item.status==='scheduled' || item.status==='failed'
        ? ''
        : (schedTs ? `<div class="qsched">jadwal: ${new Date(schedTs*1000).toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</div>` : `<div class="qsched">publish langsung</div>`);
      const progress = item.status==='uploading' && item.kind==='video' ? `<div class="qsched">${item.progress||0}%</div>` : '';
      const err = item.status==='failed' ? `<div class="err-detail">${item.detail}</div>` : '';
      const disableActions = item.status==='posted' || item.status==='scheduled' || item.status==='uploading';

      return `
        <tr>
          <td class="qnum mono">${idx+1}</td>
          <td>${thumb}</td>
          <td>
            <div class="fname">${item.file.name}</div>
            <div class="fsize">${item.kind==='photo'?'Foto':'Video'} · ${fmtBytes(item.file.size)}</div>
          </td>
          <td style="min-width:200px;">
            <textarea class="qcaption" data-id="${item.id}" placeholder="${config.caption}" ${disableActions?'disabled':''}>${item.caption}</textarea>
          </td>
          <td style="min-width:110px;">
            ${stampHtml(item.status)}
            ${schedLabel}${progress}${err}
          </td>
          <td>
            <div class="row-actions">
              ${!disableActions ? `<button class="ghost small" data-post="${item.id}">Post</button>` : ''}
              ${!disableActions ? `<button class="ghost small" data-remove="${item.id}">Hapus</button>` : ''}
            </div>
          </td>
        </tr>
      `;
    }).join('');

    const table = queue.length ? `
      <table class="queue">
        <thead><tr>
          <th>#</th><th></th><th>File</th><th>Caption (opsional)</th><th>Status</th><th></th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    ` : `<div class="empty">Belum ada file. Tambahkan video/foto untuk mulai antrian.</div>`;

    return `
      <h2>Antrian posting</h2>
      <p class="sub">Tambahkan video/foto, caption otomatis dapat link Shopee yang sama. Urutan menentukan jadwal.</p>
      ${readyBanner}
      <label class="filepicker" for="fileInput">
        + Tambah video / foto (bisa pilih beberapa sekaligus)
        <input type="file" id="fileInput" multiple accept="image/jpeg,image/png,video/mp4,video/quicktime" />
      </label>
      <div class="queue-actions">
        <div class="hint">${queue.length} item di antrian</div>
        <button class="primary" id="postAllBtn" ${posting || !queue.length ? 'disabled':''}>${posting ? 'Memproses…' : 'Post semua'}</button>
      </div>
      ${table}
    `;
  }

  function historyPanelHtml(){
    if(!history.length) return `<h2>Riwayat</h2><p class="sub">Log semua post yang sudah dikirim/dijadwalkan.</p><div class="empty">Belum ada riwayat posting.</div>`;
    const rows = history.map(h=>`
      <div class="hist-row">
        <div class="hist-time mono">${fmtTime(h.time)}</div>
        <div class="hist-body">
          <div class="hist-name">${h.filename} ${stampHtml(h.status)}</div>
          <div class="hist-cap">${h.detail || ''}</div>
        </div>
      </div>
    `).join('');
    return `
      <h2>Riwayat</h2>
      <p class="sub">Log semua post yang sudah dikirim/dijadwalkan.</p>
      <div>${rows}</div>
      <div style="margin-top:18px;"><button class="ghost" id="clearHistBtn">Bersihkan riwayat</button></div>
    `;
  }

  function settingsPanelHtml(){
    return `
      <h2>Pengaturan</h2>
      <p class="sub">Kredensial Facebook Graph API dan link afiliasi Shopee.</p>

      <fieldset>
        <legend>Kredensial Facebook</legend>
        <div class="grid2">
          <div class="field">
            <label>App ID</label>
            <input type="text" id="cfg_appId" value="${config.appId}" placeholder="123456789012345" />
          </div>
          <div class="field">
            <label>Page ID</label>
            <input type="text" id="cfg_pageId" value="${config.pageId}" placeholder="987654321098765" />
          </div>
        </div>
        <div class="field">
          <label>User Access Token (long-lived, untuk upload video)</label>
          <input type="password" id="cfg_userToken" value="${config.userToken}" placeholder="EAAG..." />
        </div>
        <div class="field">
          <label>Page Access Token (untuk publish)</label>
          <input type="password" id="cfg_pageToken" value="${config.pageToken}" placeholder="EAAG..." />
          <div class="hint">Cara ambil kedua token ada di README yang menyertai dashboard ini.</div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Konten</legend>
        <div class="field">
          <label>Link afiliasi Shopee (sama untuk semua post)</label>
          <input type="text" id="cfg_shopeeLink" value="${config.shopeeLink}" placeholder="https://shopee.co.id/..." />
        </div>
        <div class="field">
          <label>Caption default (dipakai kalau caption per-item dikosongkan)</label>
          <textarea id="cfg_caption">${config.caption}</textarea>
        </div>
      </fieldset>

      <fieldset>
        <legend>Jadwal</legend>
        <div class="checkline">
          <input type="checkbox" id="cfg_autoSchedule" ${config.autoSchedule?'checked':''} />
          <label for="cfg_autoSchedule">Jadwalkan otomatis (kalau dimatikan, post langsung publish)</label>
        </div>
        <div class="grid2">
          <div class="field">
            <label>Jam mulai posting (besok)</label>
            <input type="number" id="cfg_startHour" min="0" max="23" value="${config.startHour}" />
          </div>
          <div class="field">
            <label>Jarak antar post (jam)</label>
            <input type="number" id="cfg_intervalHours" min="1" value="${config.intervalHours}" />
          </div>
        </div>
      </fieldset>

      <div class="save-row">
        <button class="primary" id="saveCfgBtn">Simpan pengaturan</button>
        <span class="save-msg" id="saveMsg" style="display:none;">Tersimpan.</span>
      </div>
      ${!hasStorage ? `<div class="banner" style="margin-top:16px;"><strong>Catatan:</strong> penyimpanan otomatis tidak tersedia di mode ini — pengaturan hanya berlaku untuk sesi ini.</div>` : ''}
    `;
  }

  function render(){
    document.getElementById('statStrip').innerHTML = statStripHtml();
    document.querySelectorAll('#tabs button').forEach(b=>{
      b.classList.toggle('active', b.dataset.tab === activeTab);
    });
    const panel = document.getElementById('panel');
    if(activeTab==='queue') panel.innerHTML = queuePanelHtml();
    else if(activeTab==='history') panel.innerHTML = historyPanelHtml();
    else panel.innerHTML = settingsPanelHtml();

    bindPanelEvents();
  }

  function bindPanelEvents(){
    if(activeTab==='queue'){
      const fi = document.getElementById('fileInput');
      if(fi) fi.addEventListener('change', e=>addFiles(e.target.files));
      const pa = document.getElementById('postAllBtn');
      if(pa) pa.addEventListener('click', postAll);
      document.querySelectorAll('[data-post]').forEach(b=>{
        b.addEventListener('click', ()=>postSingle(b.dataset.post));
      });
      document.querySelectorAll('[data-remove]').forEach(b=>{
        b.addEventListener('click', ()=>removeItem(b.dataset.remove));
      });
      document.querySelectorAll('.qcaption').forEach(ta=>{
        ta.addEventListener('input', e=>{
          const item = queue.find(q=>q.id===ta.dataset.id);
          if(item) item.caption = e.target.value;
        });
      });
    }
    if(activeTab==='history'){
      const cb = document.getElementById('clearHistBtn');
      if(cb) cb.addEventListener('click', async ()=>{
        if(!confirm('Hapus semua riwayat?')) return;
        history = [];
        await storageSet(HISTORY_KEY, JSON.stringify(history));
        render();
      });
    }
    if(activeTab==='settings'){
      const save = document.getElementById('saveCfgBtn');
      if(save) save.addEventListener('click', async ()=>{
        config = {
          appId: document.getElementById('cfg_appId').value.trim(),
          userToken: document.getElementById('cfg_userToken').value.trim(),
          pageId: document.getElementById('cfg_pageId').value.trim(),
          pageToken: document.getElementById('cfg_pageToken').value.trim(),
          shopeeLink: document.getElementById('cfg_shopeeLink').value.trim(),
          caption: document.getElementById('cfg_caption').value.trim() || defaultConfig.caption,
          autoSchedule: document.getElementById('cfg_autoSchedule').checked,
          startHour: Number(document.getElementById('cfg_startHour').value)||10,
          intervalHours: Number(document.getElementById('cfg_intervalHours').value)||24
        };
        await storageSet(CONFIG_KEY, JSON.stringify(config));
        const msg = document.getElementById('saveMsg');
        msg.style.display = 'inline';
        setTimeout(()=>{ msg.style.display='none'; }, 2000);
      });
    }
  }

  document.getElementById('tabs').addEventListener('click', e=>{
    const btn = e.target.closest('button[data-tab]');
    if(btn) switchTab(btn.dataset.tab);
  });

  init();
})();
</script>
</body>
</html>
